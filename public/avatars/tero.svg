<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular del sistema de diseño -->
  <circle cx="50" cy="50" r="48" fill="#30264e" stroke="#b3a1ff" stroke-width="2" />

  <!-- Copete largo hacia atrás negro azabache característico del tero -->
  <path d="M41 22 C30 9 20 11 14 9 C21 18 30 24 39 28 Z" fill="#111315" />
  <path d="M43 25 C34 16 26 16 21 14 C27 21 34 25 41 29 Z" fill="#2c3032" />

  <!-- Dorso gris ceniza / pardo del tero -->
  <path d="M24 90 C24 66 35 60 50 60 C65 60 76 66 76 90 Z" fill="#606766" />
  
  <!-- Vientre blanco níveo -->
  <path d="M28 90 C28 74 36 70 43 70 L41 90 Z" fill="#f8f9fa" />
  <path d="M72 90 C72 74 64 70 57 70 L59 90 Z" fill="#f8f9fa" />
  
  <!-- Corbata y pecho negro azabache -->
  <path d="M42 60 L50 84 L58 60 Z" fill="#111315" />

  <!-- Cabeza en gris ceniza -->
  <circle cx="48" cy="42" r="19" fill="#6e7675" />
  <!-- Máscara y frente negra del tero -->
  <path d="M34 40 C34 31 40 25 48 25 C55 25 61 30 61 39 C55 37 45 36 34 40 Z" fill="#111315" />

  <!-- Ojo real del tero: anillo periocular y esclera rojo carmesí con pupila negra -->
  <circle cx="49" cy="38" r="6.5" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2" />
  <circle cx="49" cy="38" r="3" fill="#111315" />
  <circle cx="50.5" cy="36.5" r="1.2" fill="#ffffff" />

  <!-- Pico real del tero: base roja/coral y tercio distal negro -->
  <polygon points="62,40 85,45 62,48" fill="#ff4757" />
  <polygon points="76,43 85,45 76,46.5" fill="#111315" />

  <!-- Espolón alar rojo coral en el hombro -->
  <polygon points="26,67 20,63 26,61" fill="#e84118" />
</svg>
