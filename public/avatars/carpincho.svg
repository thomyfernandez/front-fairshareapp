<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular del sistema de diseño -->
  <circle cx="50" cy="50" r="48" fill="#30264e" stroke="#b3a1ff" stroke-width="2" />
  
  <!-- Orejitas en la parte superior -->
  <circle cx="37" cy="27" r="5.5" fill="#6d4323" />
  <circle cx="63" cy="27" r="5.5" fill="#6d4323" />
  <circle cx="37" cy="27" r="3" fill="#a67c52" />
  <circle cx="63" cy="27" r="3" fill="#a67c52" />

  <!-- Cuerpo / Lomo marrón parduzco natural -->
  <path d="M20 90 C20 66 32 62 50 62 C68 62 80 66 80 90 Z" fill="#754b28" />
  
  <!-- Cabeza de carpincho (pelaje pardo/leonado característico) -->
  <path d="M31 34 C31 24 40 22 50 22 C60 22 69 24 69 34 L69 56 C69 66 62 70 50 70 C38 70 31 66 31 56 Z" fill="#8a5a36" />
  
  <!-- Sombra inferior de la mandíbula / mejillas -->
  <path d="M35 56 C35 64 42 67 50 67 C58 67 65 64 65 56 Z" fill="#724724" />

  <!-- Ojos serenos cerrados (zen) -->
  <path d="M35 41 Q40 37 44 41" stroke="#2e1a10" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <path d="M56 41 Q60 37 65 41" stroke="#2e1a10" stroke-width="2.2" fill="none" stroke-linecap="round" />

  <!-- Hocico y fosas nasales oscuras de carpincho -->
  <ellipse cx="44" cy="57" rx="3" ry="4" fill="#2e1a10" />
  <ellipse cx="56" cy="57" rx="3" ry="4" fill="#2e1a10" />
  <path d="M47 63 Q50 65 53 63" stroke="#2e1a10" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Mandarina realista en la cabeza -->
  <circle cx="50" cy="19" r="6" fill="#e67e22" stroke="#d35400" stroke-width="0.8" />
  <path d="M50 13 C50 11 53 10 55 11" stroke="#27ae60" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <circle cx="48" cy="17" r="0.8" fill="#f39c12" />
</svg>
